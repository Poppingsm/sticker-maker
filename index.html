<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sticker Maker - Professional Edit</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@900&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
  <style>
    body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); justify-content: center; width: 95%; max-width: 1100px; }
    .controls { display: flex; flex-direction: column; gap: 12px; width: 320px; }
    .control-group { border: 1px solid #eee; padding: 12px; border-radius: 8px; background: #fafafa; }
    canvas { border: 2px solid #ddd; border-radius: 8px; max-width: 100%; height: auto; background-color: #fff; }
    label { font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 2px; }
    input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 8px; cursor: pointer; border-radius: 6px; border: none; background: #007bff; color: white; font-weight: bold; font-size: 12px; }
    .draw-btn { background: #ff9f43; width: 100%; margin-bottom: 5px; }
    .draw-active { background: #ee5253; }
    .undo-btn { background: #ffa502; width: 100%; margin-bottom: 5px; }
    .layer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
    .layer-btn { background: #6c5ce7; }
    .delete-btn { background: #ff4757; margin-top: 10px; }
    .save-btn { background: #2ed573; margin-top: 5px; font-size: 16px; height: 45px; }
    input[type="range"] { width: 100%; }
  </style>
</head>
<body>
  <h1>Sticker Maker</h1>
  <div class="container">
    <div class="canvas-container">
      <canvas id="sticker" width="500" height="500"></canvas>
    </div>
    <div class="controls">
      <button id="undoBtn" class="undo-btn">↩ 1つ前に戻す (Undo)</button>
      
      <div class="control-group">
        <label>重なり順（レイヤー）</label>
        <div class="layer-btns">
          <button class="layer-btn" onclick="moveLayer('front')">最前面へ</button>
          <button class="layer-btn" onclick="moveLayer('back')">最背面へ</button>
          <button class="layer-btn" onclick="moveLayer('forward')">一つ前へ</button>
          <button class="layer-btn" onclick="moveLayer('backward')">一つ後へ</button>
        </div>
      </div>

      <div class="control-group">
        <label>手書きペイント</label>
        <button id="drawModeBtn" class="draw-btn">🖊 手書きモード: OFF</button>
        <select id="brushStyle">
          <option value="pen">通常ペン</option>
          <option value="marker">マーカー</option>
          <option value="spray">スプレー</option>
        </select>
        <div style="display: flex; gap: 5px; margin-top:5px;">
          <input type="color" id="drawColor" value="#ff0000">
          <input type="range" id="drawWidth" min="1" max="40" value="5">
        </div>
      </div>

      <div class="control-group">
        <label>テキスト設定</label>
        <input type="text" id="text" value="HELLO">
        <select id="fontFamily" style="margin-top:5px;">
          <option value="'Noto Sans JP', sans-serif">極太ゴシック (Noto Sans)</option>
          <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック (M PLUS)</option>
          <option value="'Kiwi Maru', serif">手書き風 (Kiwi Maru)</option>
          <option value="'Sawarabi Mincho', serif">明朝体 (Sawarabi)</option>
          <option value="'Arial Black'">Arial Black (英字向け)</option>
        </select>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
          <input type="color" id="textColor" value="#ffffff">
          <input type="color" id="strokeColor" value="#000000">
          <input type="range" id="strokeWidth" min="0" max="20" value="5">
        </div>
        <button id="addText" style="width: 100%; margin-top: 8px; background:#6c757d;">＋ 新規テキスト追加</button>
      </div>

      <div class="control-group">
        <label>画像・AI</label>
        <input type="file" id="imageInput" accept="image/*">
        <button id="aiRemoveBg" class="ai-btn" style="background:#ef5777; width:100%; margin-top:5px;">✨ 高精度AI切り抜き</button>
      </div>

      <div class="control-group">
        <label>背景色 / 不透明度</label>
        <input type="color" id="bgColor" value="#ffffff" style="width:100%; margin-bottom:8px;">
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="1">
      </div>

      <button id="deleteBtn" class="delete-btn">選択中の要素を削除</button>
      <button id="saveImage" class="save-btn">画像を保存 (PNG)</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

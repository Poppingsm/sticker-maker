<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Maker Pro - Full Control</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
    .container { display: flex; gap: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .controls { display: flex; flex-direction: column; gap: 10px; width: 280px; max-height: 85vh; overflow-y: auto; padding-right: 10px; }
    
    /* キャンバスの背景を透明・白が見分けやすいように市松模様にする設定 */
    canvas { 
      border: 2px solid #ddd; 
      background-image: 
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), 
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      background-color: #fff; 
    }

    label { font-size: 12px; font-weight: bold; color: #555; margin-top: 5px; }
    .group { border: 1px solid #eee; padding: 10px; border-radius: 8px; background: #fafafa; }
    hr { width: 100%; border: 0; border-top: 1px solid #eee; margin: 10px 0; }
    
    button { padding: 10px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white; font-weight: bold; transition: 0.2s; }
    button:hover { background: #0056b3; }
    
    .img-btn { background: #6c757d; font-size: 13px; }
    .delete-btn { background: #ff4444; }
    .save-btn { background: #28a745; margin-top: 10px; font-size: 16px; }
    
    input[type="range"] { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Sticker Design</h1>
  <div class="container">
    <div class="controls">
      
      <div class="group">
        <label>テキスト内容</label>
        <input type="text" id="text" placeholder="文字を入力" style="width: 100%; padding: 5px; box-sizing: border-box;">
        <button id="addText" style="width: 100%; margin-top: 5px;">＋ テキストを追加</button>
        
        <label>フォント / サイズ</label>
        <select id="font" style="width: 100%; margin-bottom: 5px;">
          <option value="Impact">Impact（太め）</option>
          <option value="Arial Black">Arial Black</option>
          <option value="Georgia">Georgia（明朝系）</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
          <option value="sans-serif">標準</option>
        </select>
        <input type="range" id="fontSize" min="10" max="200" value="60">

        <label>文字色 / 縁取り色</label>
        <div style="display: flex; gap: 5px;">
          <input type="color" id="textColor" value="#ffffff" style="flex: 1; height: 30px;">
          <input type="color" id="strokeColor" value="#000000" style="flex: 1; height: 30px;">
        </div>
        <label>縁取りの太さ</label>
        <input type="range" id="strokeWidth" min="0" max="20" value="5">
      </div>

      <div class="group" style="margin-top: 10px;">
        <label>画像のインポート</label>
        <input type="file" id="imageInput" accept="image/*" style="font-size: 11px;">
        <button id="removeBg" class="img-btn" style="width: 100%; margin-top: 8px;">背景(白)を透明にする</button>
      </div>

      <div class="group" style="margin-top: 10px;">
        <label>選択中要素の不透明度</label>
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" style="width: 100%;">
        
        <label>キャンバス背景色</label>
        <input type="color" id="bgColor" value="#ffffff" style="width: 100%;">
      </div>

      <button id="deleteText" class="delete-btn">選択中の要素を削除</button>
      <button id="saveImage" class="save-btn">ステッカーを保存 (PNG)</button>
    </div>

    <div style="position: relative;">
      <canvas id="sticker" width="600" height="600"></canvas>
      <p style="font-size: 11px; color: #888; text-align: center;">ドラッグで移動・隅で拡大・上で回転</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sticker Maker - Professional Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Kiwi+Maru&family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@900&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <h1>Sticker Studio</h1>

  <div class="workspace">
    <div class="canvas-stage">
      <canvas id="sticker" width="500" height="500"></canvas>
    </div>

    <div class="sidebar">
      
      <button id="undoBtn">↩ 元に戻す (Undo)</button>

      <div class="control-group">
        <label class="control-header">テキスト編集</label>
        <input type="text" id="text" value="HELLO" placeholder="ここに入力">
        <select id="fontFamily" style="margin-top:5px;">
          <option value="'Noto Sans JP', sans-serif">極太ゴシック (Noto Sans)</option>
          <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック (M PLUS)</option>
          <option value="'Kiwi Maru', serif">手書き風 (Kiwi Maru)</option>
          <option value="'Sawarabi Mincho', serif">明朝体 (Sawarabi)</option>
          <option value="'Arial Black'">Arial Black (英字向け)</option>
        </select>
        
        <div class="tool-row">
          <input type="color" id="textColor" value="#ffffff" title="文字色">
          <input type="color" id="strokeColor" value="#000000" title="縁取り色">
          <input type="range" id="strokeWidth" min="0" max="20" value="5" title="縁取りの太さ">
        </div>
        <button id="addText" class="btn-primary" style="margin-top:8px;">＋ テキスト追加</button>
      </div>

      <div class="control-group">
        <label class="control-header">手書き・消しゴム</label>
        <div class="layer-grid">
          <button id="drawModeBtn">🖊 手書き ON</button>
          <button id="eraserBtn">🧽 消しゴム</button>
        </div>
        <select id="brushStyle" style="margin-top:5px;">
          <option value="pen">通常ペン</option>
          <option value="marker">マーカー</option>
          <option value="spray">エアブラシ</option>
        </select>
        <div class="tool-row">
          <input type="color" id="drawColor" value="#ff0000">
          <input type="range" id="drawWidth" min="1" max="40" value="5">
        </div>
      </div>
      <div class="control-group">
        <label class="control-header">画像・背景</label>
        <input type="file" id="imageInput" accept="image/*">
        <button id="aiRemoveBg" class="btn-ai" style="margin-top:8px;">✨ AI 背景削除</button>
        
        <div class="tool-row" style="margin-top:10px;">
          <label style="font-size:11px; color:#aaa; width:40px;">背景色</label>
          <input type="color" id="bgColor" value="#ffffff">
          <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" title="不透明度">
        </div>
      </div>

      <div class="control-group">
        <label class="control-header">レイヤー順序</label>
        <div class="layer-grid">
          <button onclick="moveLayer('front')">最前面</button>
          <button onclick="moveLayer('back')">最背面</button>
          <button onclick="moveLayer('forward')">一つ前</button>
          <button onclick="moveLayer('backward')">一つ後</button>
        </div>
      </div>

      <div class="control-group" style="margin-top:auto;">
        <label class="control-header">プロジェクト保存</label>
        <div class="layer-grid">
          <button id="saveProjectBtn" class="btn-primary">💾 保存する</button>
          <button id="loadProjectBtn">📂 開く</button>
        </div>
      </div>
      <button id="deleteBtn" class="btn-danger">🗑 選択要素を削除</button>
      <button id="saveImage" class="btn-success">🖼 画像書き出し (PNG)</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
